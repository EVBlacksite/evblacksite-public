name: Bug report
description: Something's broken or behaving wrong on EV Blacksite
title: "[Bug] "
labels: ["bug", "inbox"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you give,
        the faster it gets fixed. Screenshots are gold — drag them into any
        text box below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: |
        I was looking at tonight's NBA moneylines and clicked into a game.
        The page froze and the +EV number disappeared.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected the bet detail panel to open.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Walk me through it so I can hit the same bug.
      placeholder: |
        1. Open the NBA games view
        2. Filter to "tonight"
        3. Click any moneyline card
        4. See the freeze
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag image files directly into this box. Screen recordings welcome too.
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Safari 18, etc.
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: Page URL where it happened
      placeholder: https://evblacksite.com/...
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console errors (optional)
      description: |
        If you're comfortable: open dev tools (F12 or right-click → Inspect),
        go to the Console tab, and paste anything red here.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: severity
    attributes:
      label: How bad is it?
      options:
        - label: Blocks me from using the site
        - label: Workaround exists but it's annoying
        - label: Cosmetic / minor
